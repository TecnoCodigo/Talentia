name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Detectar cambios en las diferentes carpetas
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Detect Changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'

  # 2. Despliegue de Infraestructura y Backend (Solo si cambió backend o infra)
  deploy-infra-and-backend:
    runs-on: ubuntu-latest
    name: Build & Deploy Infra + Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: infra/terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="project_id=${{ secrets.GCP_PROJECT_ID }}"
        working-directory: infra/terraform

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Backend Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/credenly-repo/talentia-backend:latest ./backend
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/credenly-repo/talentia-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy talentia-backend-nestjs \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/credenly-repo/talentia-backend:latest \
            --region us-central1 \
            --set-env-vars "^;^NODE_ENV=production;DB_HOST=${{ secrets.DB_HOST }};DB_PORT=${{ secrets.DB_PORT }};DB_USER=${{ secrets.DB_USER }};DB_PASSWORD=${{ secrets.DB_PASSWORD }};DB_NAME=${{ secrets.DB_NAME }};JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }};JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }};JWT_ACCESS_EXPIRATION=15m;JWT_REFRESH_EXPIRATION=7d;FRONTEND_URL=${{ secrets.FRONTEND_URL }};GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }};R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }};R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }};R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }};R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }};R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" \
            --quiet

  # 3. Despliegue del Frontend (Solo si cambió frontend o infra)
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Build & Deploy Frontend
    needs: [changes, deploy-infra-and-backend]
    if: |
      always() && 
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true') && 
      (needs.deploy-infra-and-backend.result == 'success' || needs.deploy-infra-and-backend.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: talentia
          directory: frontend/dist
