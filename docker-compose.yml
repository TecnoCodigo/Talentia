version: '3.8'

# ======================================================
# Talentia - Orquestación local multi-contenedor
# ======================================================

services:
  mysql_db:
    image: mysql:8.0
    container_name: talentia_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: talentia_db
      MYSQL_USER: talentia_user
      MYSQL_PASSWORD: talentia_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - talentia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentia_backend_nestjs
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USER: talentia_user
      DB_PASSWORD: talentia_password
      DB_NAME: talentia_db
      JWT_ACCESS_SECRET: supersecret_access_key_p4_2026
      JWT_REFRESH_SECRET: supersecret_refresh_key_p4_2026
      JWT_ACCESS_EXPIRATION: 900s
      JWT_REFRESH_EXPIRATION: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    depends_on:
      - mysql_db
    networks:
      - talentia_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentia_frontend_react
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - talentia_network

volumes:
  mysql_data:

networks:
  talentia_network:
    driver: bridge